[package]
name = "leon-desktop"
version = "0.1.0"
description = "Leon desktop shell seed — window only, no AI logic"
edition = "2021"
license = "MIT"

[dependencies]
# Pin when scaffolding a real Tauri app with `cargo create-tauri-app`.
# This crate is a *documentation + structure seed* until toolchain is present.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "leon-desktop-seed"
path = "src/main.rs"
