[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "zenthon"
version = "1.0.0"
description = "Suni İntellekt Platforması - Tamamilə Modullu Python Platforması"
authors = ["Mireyyub <mireyyub@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mireyyub/zenthon"
documentation = "https://github.com/Mireyyub/zenthon/wiki"
keywords = ["ai", "machine-learning", "deep-learning", "pytorch", "scikit-learn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21.0"
pandas = "^1.3.0"
scikit-learn = "^1.0.0"
torch = "^1.9.0"
torchvision = "^0.10.0"
Pillow = "^8.0.0"
opencv-python = "^4.5.0"
fastapi = "^0.70.0"
uvicorn = "^0.15.0"
flask = "^2.0.0"
matplotlib = "^3.4.0"
seaborn = "^0.11.0"
scipy = "^1.7.0"
psutil = "^5.8.0"
GPUtil = "^1.4.0"

[tool.poetry.group.dev.dependencies]
black = "^22.0"
flake8 = "^4.0"
pylint = "^2.12"
isort = "^5.10"
pytest = "^7.0"
pytest-cov = "^3.0"
mkdocs = "^1.3"
mkdocs-material = "^8.5"

[tool.poetry.scripts]
zenthon-cli = "interfaces.cli.main_cli:main"
zenthon-gui = "interfaces.gui.main_gui:run_gui"
zenthon-web = "interfaces.web.web_interface:run_web_interface"
zenthon-api = "interfaces.api.main:run"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=core --cov=data --cov=models --cov=training --cov=inference --cov=interfaces --cov=utils"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
exclude = [".venv", "venv", "build", "dist"]

[tool.pylint]
max-line-length = 88
disable = ["C0114", "C0115", "C0116"]
