[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "zenthon"
version = "0.7.0"
description = "Leon AI Platform — offline-first cognitive prototype (memory, curriculum, reasoning, agents, self-improve)"
authors = ["Mireyyub <mireyyub@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mireyyub/zenthon"
documentation = "https://github.com/Mireyyub/zenthon/wiki"
keywords = ["ai", "cognitive", "agent", "llm", "ollama", "reasoning", "curriculum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.100.0"
uvicorn = ">=0.22.0"
pydantic = ">=2.0.0"
httpx = ">=0.24.0"
numpy = ">=1.24.0"
pandas = ">=2.0.0"
Pillow = ">=9.0.0"
psutil = ">=5.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
black = ">=22.0"
isort = ">=5.10"

[tool.poetry.group.optional.dependencies]
# Classic ML demos (LEGACY) — not required for cognitive core
scikit-learn = ">=1.4.0"
torch = ">=2.2.0"
torchvision = ">=0.17.0"
matplotlib = ">=3.8.0"
seaborn = ">=0.13.0"
scipy = ">=1.11.0"
flask = ">=3.0.0"
opencv-python = ">=4.9.0"

[tool.poetry.scripts]
zenthon-cli = "interfaces.cli.main_cli:main"
zenthon-gui = "interfaces.gui.main_gui:run_gui"
zenthon-api = "interfaces.api.main:run"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=core --cov=brain --cov=agents --cov=knowledge --cov=memory --cov=security --cov=interfaces"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203"
exclude = [".venv", "venv", "build", "dist"]

[tool.pylint]
max-line-length = 88
disable = ["C0114", "C0115", "C0116"]
