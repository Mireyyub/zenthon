name: Leon Cognitive CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cognitive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic httpx
      - name: Unit cognitive + security + research
        run: |
          python -m pytest \
            tests/unit/test_facts_graph_learning.py \
            tests/unit/test_security.py \
            tests/unit/test_curriculum_ask.py \
            tests/unit/test_research_and_persist.py \
            tests/unit/test_vector_memory.py \
            -q --tb=short
      - name: Integration smoke
        run: |
          python -m pytest tests/integration/test_phases_smoke.py -q --tb=short || true
      - name: Verify phases 1-8
        run: |
          python scripts/verify_phases_1_8.py || true
