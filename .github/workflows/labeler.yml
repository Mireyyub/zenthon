name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Labeler
        uses: actions/labeler@v4
        with:
          config-path: .github/labeler.yml
          sync-labels: true
